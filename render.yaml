services:
  - type: web
    name: chiba-teiden-monitor
    env: node
    buildCommand: ""
    startCommand: "node server.js"
    envVars:
      - key: PORT
        value: 10000
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
